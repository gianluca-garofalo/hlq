[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "hlq"
dynamic = ["version"]
description = "Hierarchical least-squares with inequality constraints, on one priority-ordered LQ factorization"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Gianluca Garofalo" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
classifiers = [
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/gianluca-garofalo/hlq"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/hlq"]
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
HLQ_BUILD_PYTHON = "ON"
HLQ_BUILD_TESTS = "OFF"
HLQ_INSTALL = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "include/hlq/version.hpp"
regex = '''(?sx)
\#define \s+ HLQ_VERSION_MAJOR \s+ (?P<major>\d+) .*?
\#define \s+ HLQ_VERSION_MINOR \s+ (?P<minor>\d+) .*?
\#define \s+ HLQ_VERSION_PATCH \s+ (?P<patch>\d+)
'''
result = "{major}.{minor}.{patch}"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
